services:
  tor:
    image: justsky/tor:latest
    container_name: tor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - TITLE=Tor Browser
    volumes:
      - /path/to/config:/config
    ports:
      - 3000:3000
